# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings for this repository.
language: en-US
reviews:
  profile: chill
  poem: false
  auto_review:
    # Dependabot bumps are checked by CI.
    ignore_usernames:
      - "dependabot[bot]"
    enabled: true
    drafts: false
    base_branches:
      - main
